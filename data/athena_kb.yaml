metadata:
  name: "ATHENA Knowledge Base"
  version: "0.2"
  language: "it"
  purpose: "Sperimentazione difensiva su scenari MDO e raccomandazione human-in-the-loop di contromisure"
  source_document: "OUP_Cybersecurity_MDO_SLR (8).pdf"
  safety_scope:
    allowed: "Analisi difensiva, risk management, simulazione, risposta a incidenti, mitigazione"
    disallowed: "Istruzioni operative per attacchi reali, exploit, persistenza, evasione o sabotaggio"

athena_axes:
  P_cybersecurity_process:
    govern:
      description: "Regole di ingaggio, governance cross-domain, identificazione asset critici e dipendenze"
      nist_csf_alignment: ["Govern", "Identify"]
    detect:
      description: "Ingestione e contestualizzazione CTI in tempo reale per vettori multi-dominio"
      nist_csf_alignment: ["Detect"]
    respond:
      description: "Orchestrazione di azioni per contenere e recuperare da impatti cyber-physical-social"
      nist_csf_alignment: ["Respond", "Recover"]
    prevent:
      description: "Riduzione preventiva dell'esposizione e rafforzamento controlli prima della propagazione"
      nist_csf_alignment: ["Protect"]

  D_defensive_capability:
    cyber:
      description: "Capacita' di difesa su reti, endpoint, identity, cloud, IT/OT e data pipelines"
    land:
      description: "Protezione di asset terrestri, sistemi mobili, basi, trasporti e infrastrutture fisiche"
    sea:
      description: "Protezione di porti, navi, sistemi marittimi, logistica e comunicazioni navali"
    space:
      description: "Protezione di satelliti, GNSS, comunicazioni spaziali e dipendenze di navigazione"
    air:
      description: "Protezione di piattaforme aeree, controllo del traffico, droni e comunicazioni aeronautiche"

  L_cybersecurity_level:
    organization:
      description: "Governance, policy, legal authority, relazioni di fiducia, protocolli di condivisione"
      maturity_scale: "0-5"
    intelligence:
      description: "Pipeline CTI/CRM, correlazione indicatori, asset dependency mapping, risk reasoning"
      maturity_scale: "0-5"
    tool:
      description: "SIEM/SOAR, data fusion, AI/ML pipeline, agenti autonomi o semi-autonomi"
      maturity_scale: "0-5"

  E_effect_dimension:
    cognitive:
      description: "Decision-making, percezione pubblica, fiducia, panico, manipolazione informativa"
      scale: "0.0-1.0"
    physical:
      description: "Danno a infrastrutture, persone, veicoli, impianti, societa' o ambiente"
      scale: "0.0-1.0"
    virtual:
      description: "Danno a sistemi digitali, dati, reti, servizi, cloud, IT/OT"
      scale: "0.0-1.0"

threat_model:
  diamond_vertices:
    adversary:
      fields: ["actor_type", "strategic_goal", "sophistication", "intent", "confidence"]
    capability:
      fields: ["technique_family", "domains_used", "synchronization_level", "observed_indicators"]
    infrastructure:
      fields: ["systems_abused", "dependency_chain", "civil_military_touchpoints", "exposure"]
    victim:
      fields: ["organization_type", "mission", "critical_assets", "operational_constraints", "risk_tolerance"]

scenario_vector_schema:
  co_v:
    type: "map<string,float>"
    description: "Severita' di compromissione dei controlli, 0 intatto, 1 neutralizzato"
    suggested_controls:
      GV_OC: "Organizational context and mission dependency governance"
      GV_RM: "Risk management strategy"
      ID_AM: "Asset management and dependency mapping"
      PR_AC: "Identity and access enforcement"
      PR_DS: "Data security"
      PR_PT: "Protective technology"
      DE_CM: "Continuous monitoring"
      DE_AE: "Anomaly and event detection"
      RS_AN: "Analysis during response"
      RS_CO: "Response communications"
      RS_MI: "Mitigation"
      RC_RP: "Recovery planning"
  ca_exp:
    type: "map<domain,float>"
    description: "Intensita' delle capacita' offensive osservate per dominio"
  l_v:
    type: "map<level,float>"
    description: "Stato corrente o degradazione del livello; scala 0-5"
  i_pos:
    type: "map<effect,float>"
    description: "Impatto negativo stimato; scala 0-1"

countermeasure_schema:
  fields:
    id: "Identificativo stabile"
    name: "Nome breve"
    description: "Azione difensiva o configurazione operativa"
    athena_mapping: "Assi P-D-L-E coperti"
    co_app: "Priorita' di applicazione controlli"
    ca_def: "Capacita' difensive richieste per dominio"
    l_target: "Target organization/intelligence/tool"
    i_target: "Mitigazione attesa cognitive/physical/virtual"
    cost: "Costo relativo 1-5"
    time_to_effect: "minutes | hours | days | weeks"
    availability_impact: "none | low | medium | high"
    prerequisites: "Condizioni necessarie"
    evidence_needed: "Evidenze per attivazione"
    human_approval: "true | false"

countermeasures:
  - id: "CM-001"
    name: "Cross-domain incident cell activation"
    description: "Attiva una cellula decisionale con SOC, risk owner, legal, comunicazione, operatori infrastrutturali e liaison civile/militare."
    athena_mapping:
      P: ["govern", "respond"]
      D: ["cyber", "land", "space", "air", "sea"]
      L: ["organization", "intelligence"]
      E: ["cognitive", "physical", "virtual"]
    co_app: {GV_OC: 0.9, GV_RM: 0.8, RS_CO: 0.9, RS_AN: 0.7}
    ca_def: {cyber: 0.6, land: 0.4, sea: 0.4, space: 0.4, air: 0.4}
    l_target: {organization: 4.0, intelligence: 3.5, tool: 2.5}
    i_target: {cognitive: 0.7, physical: 0.4, virtual: 0.4}
    cost: 2
    time_to_effect: "hours"
    availability_impact: "low"
    prerequisites: ["RACI definita", "canali sicuri di comunicazione", "authority per escalation"]
    evidence_needed: ["scenario multi-dominio", "incertezza elevata", "dipendenze civili/militari coinvolte"]
    human_approval: true

  - id: "CM-002"
    name: "CTI multi-source correlation and confidence scoring"
    description: "Correli indicatori tecnici, segnali OSINT, telemetria di asset e dipendenze operative assegnando confidenza e priorita' di rischio."
    athena_mapping:
      P: ["detect"]
      D: ["cyber", "space", "land"]
      L: ["intelligence", "tool"]
      E: ["virtual", "cognitive"]
    co_app: {DE_CM: 0.9, DE_AE: 0.9, RS_AN: 0.7, ID_AM: 0.6}
    ca_def: {cyber: 0.8, land: 0.3, sea: 0.2, space: 0.5, air: 0.2}
    l_target: {organization: 2.5, intelligence: 4.5, tool: 4.0}
    i_target: {cognitive: 0.5, physical: 0.2, virtual: 0.8}
    cost: 3
    time_to_effect: "hours"
    availability_impact: "none"
    prerequisites: ["SIEM/SOAR o data lake", "feed CTI", "asset inventory"]
    evidence_needed: ["indicatori eterogenei", "possibile deception", "correlazioni cross-domain"]
    human_approval: false

  - id: "CM-003"
    name: "Mission-aware segmentation and isolation"
    description: "Isola segmenti o servizi compromessi preservando servizi critici tramite priorita' di missione e dependency map."
    athena_mapping:
      P: ["respond", "prevent"]
      D: ["cyber", "land", "sea", "air"]
      L: ["tool", "organization"]
      E: ["virtual", "physical"]
    co_app: {PR_AC: 0.9, PR_PT: 0.9, RS_MI: 0.9, ID_AM: 0.8}
    ca_def: {cyber: 0.9, land: 0.5, sea: 0.4, space: 0.2, air: 0.4}
    l_target: {organization: 3.5, intelligence: 3.0, tool: 4.5}
    i_target: {cognitive: 0.2, physical: 0.7, virtual: 0.9}
    cost: 4
    time_to_effect: "minutes"
    availability_impact: "medium"
    prerequisites: ["network segmentation", "asset criticality ranking", "break-glass procedure"]
    evidence_needed: ["movimento laterale", "rischio propagazione", "asset critici esposti"]
    human_approval: true

  - id: "CM-004"
    name: "GNSS anomaly response and fallback navigation"
    description: "Attiva controlli anti-spoofing/jamming, validazione multi-sensore e fallback procedurali per asset dipendenti da GNSS."
    athena_mapping:
      P: ["detect", "respond", "prevent"]
      D: ["space", "land", "air", "sea", "cyber"]
      L: ["tool", "intelligence", "organization"]
      E: ["physical", "virtual", "cognitive"]
    co_app: {DE_AE: 0.8, PR_PT: 0.8, RS_MI: 0.8, RS_CO: 0.6}
    ca_def: {cyber: 0.5, land: 0.6, sea: 0.5, space: 0.9, air: 0.6}
    l_target: {organization: 3.5, intelligence: 4.0, tool: 4.0}
    i_target: {cognitive: 0.4, physical: 0.9, virtual: 0.6}
    cost: 4
    time_to_effect: "hours"
    availability_impact: "medium"
    prerequisites: ["sensori alternativi", "procedure fallback", "telemetria posizione"]
    evidence_needed: ["coordinate incoerenti", "segnali GNSS anomali", "cluster geografico di malfunzionamenti"]
    human_approval: true

  - id: "CM-005"
    name: "Disinformation containment and trusted communication"
    description: "Coordina comunicazione pubblica, fact-checking, canali trusted e monitoraggio narrativo per ridurre impatti cognitivi."
    athena_mapping:
      P: ["govern", "detect", "respond"]
      D: ["cyber", "land", "air", "sea", "space"]
      L: ["organization", "intelligence"]
      E: ["cognitive"]
    co_app: {RS_CO: 0.9, GV_OC: 0.7, DE_CM: 0.6}
    ca_def: {cyber: 0.5, land: 0.3, sea: 0.3, space: 0.2, air: 0.3}
    l_target: {organization: 4.5, intelligence: 3.5, tool: 2.5}
    i_target: {cognitive: 0.95, physical: 0.2, virtual: 0.2}
    cost: 2
    time_to_effect: "hours"
    availability_impact: "none"
    prerequisites: ["messaggi pre-approvati", "portavoce", "canali ufficiali resilienti"]
    evidence_needed: ["narrative ostili", "panico pubblico", "informazioni false coordinate"]
    human_approval: true

  - id: "CM-006"
    name: "Adaptive access hardening"
    description: "Rafforza accessi, privilegi, MFA e conditional access in base a rischio, asset criticality e indicatori CTI."
    athena_mapping:
      P: ["prevent", "respond"]
      D: ["cyber"]
      L: ["tool", "organization"]
      E: ["virtual"]
    co_app: {PR_AC: 1.0, PR_DS: 0.5, DE_CM: 0.5}
    ca_def: {cyber: 0.9, land: 0.0, sea: 0.0, space: 0.0, air: 0.0}
    l_target: {organization: 3.0, intelligence: 3.0, tool: 4.0}
    i_target: {cognitive: 0.1, physical: 0.2, virtual: 0.85}
    cost: 2
    time_to_effect: "minutes"
    availability_impact: "low"
    prerequisites: ["IAM centralizzato", "MFA", "policy conditional access"]
    evidence_needed: ["credential abuse", "login anomali", "privilege escalation"]
    human_approval: false

  - id: "CM-007"
    name: "Cyber deception and decoy telemetry"
    description: "Distribuisce honeypot, honeytoken e decoy asset per rilevare, rallentare e confondere movimenti avversari."
    athena_mapping:
      P: ["detect", "prevent"]
      D: ["cyber"]
      L: ["tool", "intelligence"]
      E: ["virtual", "cognitive"]
    co_app: {DE_AE: 0.8, DE_CM: 0.8, PR_PT: 0.5}
    ca_def: {cyber: 0.8, land: 0.0, sea: 0.0, space: 0.0, air: 0.0}
    l_target: {organization: 2.5, intelligence: 4.0, tool: 4.0}
    i_target: {cognitive: 0.4, physical: 0.1, virtual: 0.7}
    cost: 3
    time_to_effect: "days"
    availability_impact: "none"
    prerequisites: ["ambiente controllato", "logging", "regole di ingaggio"]
    evidence_needed: ["ricognizione", "movimento laterale sospetto", "APT dwell time"]
    human_approval: true

  - id: "CM-008"
    name: "Resilient recovery and service prioritization"
    description: "Ripristina servizi secondo priorita' di missione, con backup validati, runbook e comunicazioni coordinate."
    athena_mapping:
      P: ["respond"]
      D: ["cyber", "land", "sea", "air", "space"]
      L: ["organization", "tool"]
      E: ["physical", "virtual", "cognitive"]
    co_app: {RC_RP: 0.9, RS_CO: 0.8, RS_MI: 0.7, PR_DS: 0.7}
    ca_def: {cyber: 0.7, land: 0.4, sea: 0.4, space: 0.4, air: 0.4}
    l_target: {organization: 4.0, intelligence: 3.0, tool: 4.0}
    i_target: {cognitive: 0.5, physical: 0.7, virtual: 0.8}
    cost: 4
    time_to_effect: "hours"
    availability_impact: "low"
    prerequisites: ["backup testati", "runbook", "dependency map", "priorita' missione"]
    evidence_needed: ["servizio degradato", "ransomware o wiper sospetto", "impatto su continuita' operativa"]
    human_approval: true

scoring:
  default_weights:
    w1_impact_gap: 0.45
    w2_control_residual: 0.35
    w3_level_gap: 0.20
  constraints:
    budget_B: 10
    max_availability_impact: "medium"
    require_human_approval_for:
      - "azioni con availability_impact medium o high"
      - "azioni cross-domain"
      - "azioni che coinvolgono comunicazione pubblica o autorita' esterne"
  decision_policy:
    rank_by: "lowest_residual_risk"
    tie_breakers:
      - "lower_time_to_effect"
      - "lower_availability_impact"
      - "higher_evidence_confidence"
      - "lower_cost"

example_scenarios:
  - id: "SCN-001"
    name: "Connected vehicle GNSS spoofing with disinformation"
    description: "Scenario ispirato al caso illustrativo ATHENA: vulnerabilita' software e segnali GNSS falsati su veicoli con campagna social coordinata."
    diamond:
      adversary:
        actor_type: "state-sponsored or proxy"
        strategic_goal: "degradare fiducia, mobilita' e risposta emergenziale"
        sophistication: "high"
        intent: "disruption and cognitive pressure"
        confidence: 0.7
      capability:
        technique_family: ["GNSS spoofing", "software exploitation", "coordinated disinformation"]
        domains_used: ["cyber", "space", "land"]
        synchronization_level: "high"
        observed_indicators: ["coordinate incoerenti", "malfunzionamenti clusterizzati", "narrative social coordinate"]
      infrastructure:
        systems_abused: ["connected vehicle backend", "GNSS dependency", "social platforms"]
        dependency_chain: ["navigation", "vehicle operations", "emergency response", "public communication"]
        civil_military_touchpoints: ["trasporti", "protezione civile", "forze dell'ordine"]
        exposure: "high"
      victim:
        organization_type: "civil critical infrastructure operator"
        mission: "continuita' mobilita' e sicurezza pubblica"
        critical_assets: ["fleet", "navigation services", "communication channels"]
        operational_constraints: ["no full shutdown", "public safety", "time pressure"]
        risk_tolerance: "low"
    x:
      co_v: {DE_AE: 0.7, DE_CM: 0.6, RS_CO: 0.8, PR_PT: 0.6, ID_AM: 0.5}
      ca_exp: {cyber: 0.7, land: 0.6, sea: 0.0, space: 0.9, air: 0.0}
      l_v: {organization: 2.0, intelligence: 2.0, tool: 2.5}
      i_pos: {cognitive: 0.9, physical: 0.5, virtual: 0.75}
    suggested_candidates: ["CM-001", "CM-002", "CM-004", "CM-005", "CM-008"]
  - id: "SCN-002"
    name: "Port OT/CPS disruption with maritime logistics impact"
    description: "Compromissione OT/CPS in ambiente portuale con effetti su logistica marittima, continuita' fisica e coordinamento operativo."
    x:
      co_v: {ID_AM: 0.75, PR_PT: 0.8, DE_AE: 0.65, RS_MI: 0.7, RC_RP: 0.45}
      ca_exp: {cyber: 0.75, land: 0.35, sea: 0.85, space: 0.15, air: 0.1}
      l_v: {organization: 2.3, intelligence: 2.4, tool: 2.1}
      i_pos: {cognitive: 0.35, physical: 0.85, virtual: 0.7}
    suggested_candidates: ["CM-001", "CM-002", "CM-003", "CM-008"]
  - id: "SCN-003"
    name: "Air command data poisoning and model drift"
    description: "Manipolazione di dati e modelli decisionali a supporto di asset aerei e command-and-control."
    x:
      co_v: {PR_DS: 0.8, DE_AE: 0.75, RS_AN: 0.72, GV_RM: 0.55}
      ca_exp: {cyber: 0.72, land: 0.15, sea: 0.1, space: 0.45, air: 0.78}
      l_v: {organization: 2.2, intelligence: 1.8, tool: 2.6}
      i_pos: {cognitive: 0.68, physical: 0.38, virtual: 0.82}
    suggested_candidates: ["CM-001", "CM-002", "CM-007", "CM-008"]
  - id: "SCN-004"
    name: "Identity compromise across joint operations"
    description: "Compromissione credenziali e privilegi in operazioni congiunte e domini multipli."
    x:
      co_v: {PR_AC: 0.92, DE_CM: 0.58, RS_AN: 0.55, GV_RM: 0.45}
      ca_exp: {cyber: 0.88, land: 0.45, sea: 0.38, space: 0.28, air: 0.42}
      l_v: {organization: 2.4, intelligence: 2.5, tool: 2.7}
      i_pos: {cognitive: 0.42, physical: 0.25, virtual: 0.82}
    suggested_candidates: ["CM-001", "CM-002", "CM-006", "CM-008"]
  - id: "SCN-005"
    name: "Supply chain compromise of multi-domain sensor software"
    description: "Compromissione supply chain software con impatto su sensori e dipendenze operative multi-dominio."
    x:
      co_v: {GV_RM: 0.78, ID_AM: 0.82, PR_DS: 0.62, DE_CM: 0.66, PR_PT: 0.55}
      ca_exp: {cyber: 0.76, land: 0.55, sea: 0.48, space: 0.52, air: 0.58}
      l_v: {organization: 1.9, intelligence: 2.3, tool: 2.6}
      i_pos: {cognitive: 0.48, physical: 0.52, virtual: 0.78}
    suggested_candidates: ["CM-001", "CM-002", "CM-003", "CM-008"]
  - id: "SCN-006"
    name: "Coordinated DISARM-style influence operation"
    description: "Campagna informativa coordinata con manipolazione cognitiva e pressione su decisori, cittadini o operatori critici."
    x:
      co_v: {RS_CO: 0.9, GV_OC: 0.72, DE_CM: 0.58, RS_AN: 0.52}
      ca_exp: {cyber: 0.55, land: 0.48, sea: 0.34, space: 0.25, air: 0.4}
      l_v: {organization: 1.8, intelligence: 2.0, tool: 2.8}
      i_pos: {cognitive: 0.95, physical: 0.2, virtual: 0.45}
    suggested_candidates: ["CM-001", "CM-002", "CM-005"]
  - id: "SCN-007"
    name: "Satellite communication disruption and fallback coordination"
    description: "Interruzione o degrado comunicazioni satellitari con necessita' di fallback e coordinamento multi-dominio."
    x:
      co_v: {PR_PT: 0.68, DE_CM: 0.62, RS_CO: 0.82, RC_RP: 0.58}
      ca_exp: {cyber: 0.58, land: 0.52, sea: 0.6, space: 0.88, air: 0.7}
      l_v: {organization: 2.0, intelligence: 2.25, tool: 2.5}
      i_pos: {cognitive: 0.62, physical: 0.55, virtual: 0.58}
    suggested_candidates: ["CM-001", "CM-002", "CM-004", "CM-005", "CM-008"]
  - id: "SCN-008"
    name: "Historical Stuxnet-style ICS sabotage at Natanz"
    description: "Scenario storico ispirato a Stuxnet: worm ICS/SCADA scoperto nel 2010, mirato a sistemi Siemens Step7/PLC e associato al sabotaggio fisico di centrifughe a Natanz. Usato qui solo come caso difensivo multi-dominio."
    x:
      co_v: {ID_AM: 0.72, PR_PT: 0.92, DE_AE: 0.88, DE_CM: 0.72, RS_MI: 0.8, PR_DS: 0.55}
      ca_exp: {cyber: 0.95, land: 0.82, sea: 0.0, space: 0.05, air: 0.05}
      l_v: {organization: 2.1, intelligence: 2.0, tool: 1.9}
      i_pos: {cognitive: 0.45, physical: 0.9, virtual: 0.86}
    suggested_candidates: ["CM-001", "CM-002", "CM-003", "CM-006", "CM-008"]
  - id: "SCN-009"
    name: "NATO CCDCOE NotPetya-style supply-chain wiper"
    description: "Scenario storico-difensivo ispirato a NotPetya: compromissione supply chain software/update, propagazione laterale e impatto wiper su organizzazioni pubbliche, logistica, trasporti, industria e servizi critici."
    diamond:
      adversary:
        actor_type: "state-linked destructive cyber actor"
        strategic_goal: "degradare continuita' operativa, fiducia nei servizi e capacita' logistica"
        sophistication: "high"
        intent: "disruption and irreversible data destruction"
        confidence: 0.78
      capability:
        technique_family: ["software supply-chain compromise", "credential abuse", "lateral movement", "destructive wiper"]
        domains_used: ["cyber", "land", "sea", "air"]
        synchronization_level: "high"
        observed_indicators: ["malicious software update", "rapid internal propagation", "irreversible encryption or wiper behavior", "service outage across business units"]
      infrastructure:
        systems_abused: ["trusted update mechanism", "Windows enterprise networks", "identity and admin tooling", "logistics and operations platforms"]
        dependency_chain: ["vendor update", "enterprise endpoints", "identity propagation", "business continuity", "public and allied services"]
        civil_military_touchpoints: ["logistica", "trasporti", "energia", "sanita'", "servizi governativi"]
        exposure: "very high"
      victim:
        organization_type: "public-private critical service ecosystem"
        mission: "continuita' operativa e preservazione servizi essenziali"
        critical_assets: ["identity services", "endpoint fleet", "backup and recovery", "logistics systems", "operational communications"]
        operational_constraints: ["no complete shutdown", "restore priority services first", "coordinate public messaging", "preserve forensic evidence"]
        risk_tolerance: "very low"
    x:
      co_v: {GV_RM: 0.72, ID_AM: 0.84, PR_AC: 0.82, PR_DS: 0.78, PR_PT: 0.86, DE_CM: 0.74, DE_AE: 0.82, RS_AN: 0.7, RS_MI: 0.88, RC_RP: 0.9}
      ca_exp: {cyber: 0.96, land: 0.72, sea: 0.58, space: 0.12, air: 0.44}
      l_v: {organization: 1.8, intelligence: 2.1, tool: 2.0}
      i_pos: {cognitive: 0.68, physical: 0.62, virtual: 0.96}
    suggested_candidates: ["CM-001", "CM-002", "CM-003", "CM-006", "CM-008"]
  - id: "SCN-010"
    name: "Viasat KA-SAT satellite communications disruption"
    description: "Scenario storico-difensivo basato sull'attacco Viasat KA-SAT del 23-24 febbraio 2022: compromissione di infrastruttura di gestione SATCOM, distribuzione di wiper AcidRain verso modem e interruzione di comunicazioni satellitari in Ucraina con spillover europeo."
    diamond:
      adversary:
        actor_type: "state-linked military cyber actor"
        strategic_goal: "degradare comunicazioni satellitari e supporto C2 durante fase cinetica"
        sophistication: "high"
        intent: "disruption of satellite broadband terminals"
        confidence: 0.82
      capability:
        technique_family: ["satellite ground segment compromise", "management network abuse", "firmware or modem wiper", "communications disruption"]
        domains_used: ["cyber", "space", "land", "air", "sea"]
        synchronization_level: "high"
        observed_indicators: ["large-scale modem outage", "loss of satellite broadband connectivity", "AcidRain-like destructive firmware behavior", "spillover to European civilian services"]
      infrastructure:
        systems_abused: ["SATCOM management network", "KA-SAT ground infrastructure", "SurfBeam modem fleet", "remote terminal update or control path"]
        dependency_chain: ["ground management access", "terminal configuration", "satellite broadband service", "military and civilian communications", "mission continuity"]
        civil_military_touchpoints: ["comunicazioni militari", "servizi governativi", "energia e turbine eoliche", "utenze civili europee"]
        exposure: "high"
      victim:
        organization_type: "satellite communications provider and dependent public-private users"
        mission: "mantenere connettivita' SATCOM resiliente durante crisi"
        critical_assets: ["SATCOM modems", "ground management systems", "teleport operations", "fallback communications", "incident coordination"]
        operational_constraints: ["restore terminals at scale", "avoid disruption of unaffected gateways", "prioritize military and emergency users", "coordinate vendor and allied response"]
        risk_tolerance: "very low"
    x:
      co_v: {GV_OC: 0.7, GV_RM: 0.66, ID_AM: 0.82, PR_AC: 0.72, PR_PT: 0.88, DE_CM: 0.76, DE_AE: 0.84, RS_CO: 0.82, RS_MI: 0.86, RC_RP: 0.74}
      ca_exp: {cyber: 0.9, land: 0.58, sea: 0.4, space: 0.94, air: 0.52}
      l_v: {organization: 2.0, intelligence: 2.15, tool: 2.2}
      i_pos: {cognitive: 0.58, physical: 0.52, virtual: 0.92}
    suggested_candidates: ["CM-001", "CM-002", "CM-004", "CM-005", "CM-008"]

